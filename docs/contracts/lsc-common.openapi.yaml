openapi: 3.1.0
info:
  title: LiveScoreCounter - shared contract components (premium tiers)
  version: 1.0.0
  summary: Shared schemas and responses referenced by the Gateway, IdentityService and SubscriptionService contracts.
  description: |
    Components-only document. It defines:

    * RFC 9457 Problem Details used by every LSC service (`application/problem+json`).
    * The **tier-required 403** problem (`https://livescorecounter.app/problems/tier-required`, PRD FR-ENT-05).
    * The entitlement status DTO shared by SubscriptionService and the Gateway (PRD FR-ENT-06).
    * The public feature map document served by the Gateway at `GET /api/v1/features` (PRD FR-MAP-04).

    Frozen for implementation of PRD `docs/prd/premium-tiers.md` v1.1.
    Architecture: `docs/architecture/premium-tiers.md`.
  license:
    name: Proprietary - internal use only
    identifier: LicenseRef-Proprietary
paths: {}
components:
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details as produced by ASP.NET Core `AddProblemDetails()` / the existing `GlobalExceptionHandler`.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          description: W3C trace id of the request (ASP.NET Core default extension).
        correlationId:
          type: string
          description: Value of the `X-Correlation-Id` header for this request.
      additionalProperties: true

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              description: Field name -> list of validation messages.
              additionalProperties:
                type: array
                items:
                  type: string

    TierName:
      type: string
      description: |
        Tier identifier from the Gateway `TierAuthorization:tiers` configuration. v1 ships `free` (rank 0) and `premium` (rank 1).
        Clients MUST treat unknown values as the lowest-rank tier.
      pattern: '^[a-z][a-z0-9_-]{0,31}$'
      examples:
        - free
        - premium

    FeatureKey:
      type: string
      description: Dotted feature key from the feature map (for example `streaming.youtube`). Unknown keys are treated as locked by clients.
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
      maxLength: 64
      examples:
        - streaming.youtube
        - sessions.remote.host

    TierRequiredProblem:
      description: |
        Returned with HTTP 403 by the Gateway when the caller's effective tier (from the verified Firebase ID token claims
        `tier` / `tier_exp`) ranks below the minimum tier of the feature mapped to the requested route.
        A missing or invalid token is a 401, never this problem.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [type, title, status, feature, requiredTier, currentTier]
          properties:
            type:
              const: https://livescorecounter.app/problems/tier-required
            title:
              const: Tier required
            status:
              const: 403
            feature:
              $ref: '#/components/schemas/FeatureKey'
            requiredTier:
              $ref: '#/components/schemas/TierName'
            currentTier:
              $ref: '#/components/schemas/TierName'
      examples:
        - type: https://livescorecounter.app/problems/tier-required
          title: Tier required
          status: 403
          detail: Feature 'sessions.remote.host' requires tier 'premium'.
          instance: /api/v1/sessions
          feature: sessions.remote.host
          requiredTier: premium
          currentTier: free
          correlationId: 4f7c1c1e2b6a4b0e9d0f0b8c7d6e5f4a

    RateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            type:
              const: https://livescorecounter.app/problems/rate-limited
            status:
              const: 429
            retryAfterSeconds:
              type: integer
              minimum: 1

    UpstreamUnavailableProblem:
      description: A dependency (RevenueCat, Firebase, IdentityService, database) is unavailable. Safe to retry with backoff.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            type:
              enum:
                - https://livescorecounter.app/problems/upstream-unavailable
                - https://livescorecounter.app/problems/revenuecat-unavailable
                - https://livescorecounter.app/problems/identity-unavailable
            dependency:
              type: string
              enum: [revenuecat, firebase, identity-service, subscription-service, database]

    EntitlementSource:
      type: string
      enum: [store, promotional, none]

    PeriodType:
      type: string
      enum: [normal, trial, intro]

    ProvisioningState:
      type: string
      description: Whether the RevenueCat customer has been confirmed for this UID (PRD FR-USR-01/02, D10).
      enum: [pending, provisioned, failed]

    EntitlementStatus:
      type: object
      description: |
        Current entitlement of a Firebase UID as stored by SubscriptionService (recomputed from RevenueCat, PRD FR-ENT-02).
        Never derived from the ID token. `features` is populated only by the Gateway (it owns the feature map) and is absent
        when the response comes straight from SubscriptionService.
      required: [uid, tier, source, willRenew, billingIssue, version, provisioningState]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
        tier:
          $ref: '#/components/schemas/TierName'
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: UTC expiry of the entitlement as reported by RevenueCat. `null` = no expiry (lifetime) or free.
        willRenew:
          type: boolean
        source:
          $ref: '#/components/schemas/EntitlementSource'
        periodType:
          oneOf:
            - $ref: '#/components/schemas/PeriodType'
            - type: 'null'
        store:
          type: [string, 'null']
          description: RevenueCat store (`play_store`, `promotional`, ...).
          examples: [play_store]
        productId:
          type: [string, 'null']
          examples: [lsc_premium_monthly]
        billingIssue:
          type: boolean
          description: true when RevenueCat reports `billing_issues_detected_at` for the active subscription (grace period).
        billingIssueDetectedAt:
          type: [string, 'null']
          format: date-time
        managementUrl:
          type: [string, 'null']
          format: uri
          description: RevenueCat `management_url` (Google Play subscription management).
        version:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic entitlement version; mirrored into the `tier_ver` claim.
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
          description: Last successful RevenueCat refetch (`revenueCatLastSyncedAt`).
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        features:
          type: object
          description: Feature key -> unlocked for this tier. Gateway responses only.
          propertyNames:
            $ref: '#/components/schemas/FeatureKey'
          additionalProperties:
            type: boolean
      examples:
        - uid: Xq3b8Zt1nVd0h2Kp
          tier: premium
          expiresAt: '2026-11-26T10:00:00Z'
          willRenew: true
          source: store
          periodType: normal
          store: play_store
          productId: lsc_premium_monthly
          billingIssue: false
          billingIssueDetectedAt: null
          managementUrl: https://play.google.com/store/account/subscriptions
          version: 7
          lastVerifiedAt: '2026-10-26T10:00:03Z'
          provisioningState: provisioned
          features:
            scoring.local: true
            streaming.youtube: true
            sessions.remote.host: true
            sessions.remote.join: true

    SyncResult:
      description: Result of an app-triggered sync (PRD FR-SYNC-01).
      allOf:
        - $ref: '#/components/schemas/EntitlementStatus'
        - type: object
          required: [tierChanged, claimsPending]
          properties:
            tierChanged:
              type: boolean
              description: true if the effective tier changed. The app MUST then force-refresh the Firebase ID token before calling a gated route.
            claimsPending:
              type: boolean
              description: |
                true if the entitlement was updated but the Firebase claim write has not been confirmed yet (IdentityService or
                Firebase unavailable). The app keeps retrying sync with backoff (PRD FR-APP-05 "activation is taking longer").

    FeatureMapDocument:
      type: object
      description: |
        Public projection of the Gateway `TierAuthorization` configuration (tiers + features, never routes). Same shape as the
        app's embedded fallback copy. JSON Schema: `docs/contracts/feature-tier-map.schema.json#/$defs/FeatureMapDocument`.
      required: [schemaVersion, defaultTier, tiers, features]
      properties:
        schemaVersion:
          type: integer
          const: 1
        defaultTier:
          $ref: '#/components/schemas/TierName'
        tiers:
          type: object
          description: Tier name -> rank. Ranks are unique; the lowest rank is the default tier.
          propertyNames:
            $ref: '#/components/schemas/TierName'
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 100
          minProperties: 1
        features:
          type: object
          description: Feature key -> minimum tier.
          propertyNames:
            $ref: '#/components/schemas/FeatureKey'
          additionalProperties:
            $ref: '#/components/schemas/TierName'
      examples:
        - schemaVersion: 1
          defaultTier: free
          tiers:
            free: 0
            premium: 1
          features:
            scoring.local: free
            streaming.youtube: premium
            sessions.remote.host: premium
            sessions.remote.join: free

  headers:
    X-Correlation-Id:
      description: Correlation id. Echoed back; generated by the Gateway when absent and propagated to every downstream call.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]{1,64}$'
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    ETag:
      description: Strong entity tag of the representation.
      schema:
        type: string

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]{1,64}$'
    Uid:
      name: uid
      in: path
      required: true
      description: Firebase UID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{1,128}$'

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Missing, expired or invalid Firebase ID token (or invalid service credential).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated but not allowed (for example the `admin` claim is missing).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TierRequired:
      description: The caller's tier is below the feature's minimum tier (PRD FR-ENT-05).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TierRequiredProblem'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: State conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitedProblem'
    BadGateway:
      description: An upstream dependency returned an error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UpstreamUnavailableProblem'
    ServiceUnavailable:
      description: A required dependency is unavailable. Retry with backoff.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UpstreamUnavailableProblem'
    InternalServerError:
      description: Unexpected error. `detail` is generic.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT)
      description: |
        Firebase ID token. Validated against `https://securetoken.google.com/<projectId>` (issuer), audience = project id,
        signature (Google JWKS, cached), `exp`, `iat`, non-empty `sub`. Tokens are never logged.
